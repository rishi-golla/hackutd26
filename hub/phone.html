<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Handoff · Bodycam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23ff4d6d%27 d=%27M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.8-1.3 2.3-2.4 4.4-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z%27/%3E%3C/svg%3E">
<style>
  :root { --bg:#07090d; --panel:#0e1219; --line:#1a212c; --text:#eef2f6; --dim:#7f8c9a; --ok:#3fd68f; --bad:#ff6b6b; --hr:#ff4d6d; --accent:#4cc2ff; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color:transparent; }
  ::selection { background:#26435f; }
  body { display:flex; flex-direction:column; gap:12px; padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }

  header { display:flex; align-items:center; gap:14px; }
  .logo { font-size:20px; font-weight:800; letter-spacing:-.03em; margin-right:auto; }
  .logo i { color:var(--hr); font-style:normal; }
  .dot { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; }
  .dot::before { content:""; width:7px; height:7px; border-radius:50%; background:#2b3542; transition:background .3s; }
  .dot.on::before { background:var(--ok); } .dot.off::before { background:var(--bad); }

  .cam { position:relative; flex:1; min-height:180px; border-radius:22px; overflow:hidden; background:#000 radial-gradient(circle at 50% 45%, #121a24, #000 70%); }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .hint { position:absolute; inset:0; display:grid; place-items:center; padding:28px; text-align:center; color:var(--dim); text-wrap:balance; }
  .hint.err { color:var(--bad); }

  .vitals { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:12px 16px; }
  .label { color:var(--dim); font-size:12px; font-weight:600; }
  .vital { transition:opacity .4s; } .vital.off { opacity:.35; }
  .big { display:flex; align-items:baseline; gap:5px; }
  .big b { font-size:44px; font-weight:800; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .big span { color:var(--dim); font-size:13px; }
  .o2 { color:var(--accent); font-size:12px; font-weight:600; margin-top:4px; min-height:1.4em; }
  .hr b { color:var(--hr); }
  .status b { color:var(--accent); font-size:22px; letter-spacing:-.01em; line-height:1.6; }
  .said p { margin-top:2px; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  button { width:100%; border:0; border-radius:99px; padding:17px; background:var(--text); color:var(--bg); font:700 17px system-ui, -apple-system, sans-serif; cursor:pointer; transition:transform .15s, background .3s, color .3s; }
  button:active { transform:scale(.97); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  button:disabled { background:transparent; color:var(--ok); border:1px solid #1d4a35; transform:none; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:13px; font-size:14px; font-weight:600; }
  .row { display:flex; gap:10px; }
</style>
</head>
<body>
<header>
  <div class="logo">Hand<i>off</i></div>
  <span id="dHub" class="dot">Hub</span><span id="dCam" class="dot">Cam</span><span id="dMic" class="dot">Mic</span><span id="dVoice" class="dot" hidden>Voice</span>
</header>

<div class="cam"><video id="video" autoplay playsinline muted></video><div id="hint" class="hint">Tap Start to turn on the camera and mic</div></div>

<div class="vitals">
  <div class="card vital hr off" id="vHr"><div class="label">Heart rate</div><div class="big"><b id="hr">—</b><span>bpm</span></div><div class="o2" id="o2"></div></div>
  <div class="card vital status"><div class="label">Sensor</div><div class="big"><b id="status">—</b></div></div>
</div>

<div class="card said"><div class="label">Last spoken</div><p id="said">Nothing yet</p></div>

<button id="start">Start</button>
<div class="row"><button id="test" class="ghost">Test speaker</button><button id="flip" class="ghost">Flip camera</button></div>

<canvas id="canvas" hidden></canvas>
<script src="/common.js"></script>
<script>
const video = $('video'), canvas = $('canvas');
let stream = null, recorder = null, facing = 'environment', running = false, hrAt = 0, stAt = 0, o2At = 0;

const dot = (id, state) => { $(id).className = 'dot ' + state; };
const hint = (text, err) => { $('hint').hidden = !text; $('hint').textContent = text || ''; $('hint').classList.toggle('err', !!err); };
const post = (path, body, json) => fetch(path, { method:'POST', body, signal: AbortSignal.timeout(10000),
  headers: json ? { 'Content-Type':'application/json' } : {} });       // a dead link must not hold an upload slot forever
const send = (what, value) => post('/send', JSON.stringify({ from:'phone', what, value }), true).catch(() => {});

function speak(text) {
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(String(text)));
  $('said').textContent = text;
}

const answeredAt = poll((m, age) => {
  if (m.what === 'say' && running && age < 10) { speak(m.value); send('said', m.value); }
  // The voice worker's link: the newest one wins. A replayed one counts only if it is recent (link.sh re-announces
  // every 30 s), so a dead link from an earlier run doesn't come back on every page load.
  if (m.what === 'voice' && Date.now() / 1000 - (m.t || 0) < 90) setVoiceUrl(m.value);
  if (age > 4) return;                                          // catch-up or backlog: never a live value
  if (m.what === 'hr') { $('hr').textContent = m.value || '—'; hrAt = Date.now(); }
  if (m.what === 'state') { $('status').textContent = labels[m.value] || m.value; stAt = Date.now(); }
  if (m.what === 'spo2') { $('o2').textContent = m.value ? `SpO₂ ${m.value}% · experimental` : ''; o2At = Date.now(); }
});

setInterval(() => {
  dot('dHub', Date.now() - answeredAt() < 12000 ? 'on' : 'off');
  if (Date.now() - hrAt > STALE_MS) $('hr').textContent = '—';
  if (Date.now() - stAt > STALE_MS) $('status').textContent = '—';
  if (Date.now() - o2At > STALE_MS) $('o2').textContent = '';
  $('vHr').classList.toggle('off', $('hr').textContent === '—');
}, 1000);

// The main rear lens, by device. On a Pixel 9 Pro, Chrome's "environment" camera can be the telephoto or the macro
// lens: the preview is a dark blur of whatever is a few centimetres away (seen live, Sun ~05:30). Android labels the
// lenses "camera2 0, facing back", "camera2 2, facing back", …; the main wide camera has the lowest number. Labels are
// known only after the first permission, so the first Start may open the default lens and switch at once.
async function mainRearCamera() {
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput' && /back|rear|environment/i.test(d.label));
    cams.sort((a, b) => parseInt((a.label.match(/\d+/) || ['99'])[0], 10) - parseInt((b.label.match(/\d+/) || ['99'])[0], 10));
    return cams[0] || null;
  } catch (_) { return null; }
}

async function openCamera() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  // Echo cancellation on: the speaker sits on the chest next to the mic, and the voice agent must not hear itself.
  const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  let rear = facing === 'environment' ? await mainRearCamera() : null;
  stream = await navigator.mediaDevices.getUserMedia({ video: rear ? { deviceId: { exact: rear.deviceId }, ...size } : { facingMode: facing, ...size }, audio });
  if (facing === 'environment' && !rear) {
    // First time: the permission just granted gives us the labels. If the default lens isn't the main one, swap now.
    rear = await mainRearCamera();
    const current = stream.getVideoTracks()[0]?.getSettings().deviceId;
    if (rear && current && rear.deviceId !== current) {
      stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: rear.deviceId }, ...size }, audio });
    }
  }
  if (rear) console.log('rear camera:', rear.label);
  video.srcObject = stream;
  stream.getTracks().forEach((t) => { t.onended = () => { dot('dCam', 'off'); dot('dMic', 'off'); hint('Camera stopped. Tap Start.', true); stopped(); }; });
  hint('');
  startMic();
  voiceOn = true;
  voiceBackoff = 2000;
  connectVoice().catch(voiceRetry);
}

// Mic: 1 s chunks into one webm file on the hub, a fresh file each time the mic starts.
function startMic() {
  recorder = new MediaRecorder(new MediaStream(stream.getAudioTracks()), MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : {});
  let first = true;
  recorder.ondataavailable = (e) => {
    if (!e.data.size) return;
    post('/audio' + (first ? '?new=1' : ''), e.data).then((r) => dot('dMic', r.ok ? 'on' : 'off'), () => dot('dMic', 'off'));
    first = false;
  };
  recorder.onerror = () => dot('dMic', 'off');
  recorder.start(1000);
}

// Camera: 10 frames a second at 960 px. Up to 3 uploads in flight, so the tunnel's round trip doesn't cap the rate.
const ctx = canvas.getContext('2d');
let inFlight = 0, n = 0;
setInterval(() => {
  const track = stream && stream.getVideoTracks()[0];
  if (!running || inFlight >= 3 || !track || track.readyState !== 'live' || !video.videoWidth) return;
  canvas.width = 960; canvas.height = Math.round(video.videoHeight * 960 / video.videoWidth);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  inFlight++;
  canvas.toBlob((b) => post('/frame?n=' + (++n), b).then((r) => dot('dCam', r.ok ? 'on' : 'off'), () => dot('dCam', 'off')).finally(() => { inFlight--; }), 'image/jpeg', 0.65);
}, 100);

// Voice agent (spec §19, §22.6, decision 23): while the bodycam runs, the mic and camera go to the Pipecat worker
// (voice/pipecat) over WebRTC and its spoken replies play here: an open mic, all the time. Which worker:
//   ?voice=<url> (?voice=off: none) > this page's own origin when the worker serves it (/phone.html) >
//   the link the worker announced to the hub ({"what":"voice"}, voice/pipecat/link.sh), the newest one.
// A dropped or failed link reconnects by itself (2, 4, 8, then every 15 s). Without a worker the page works as before.
const voiceParam = new URLSearchParams(location.search).get('voice');
const voiceFixed = voiceParam !== null || location.pathname === '/phone.html';
let voiceUrl = voiceParam === 'off' ? null : voiceParam || (location.pathname === '/phone.html' ? location.origin : null);
const voiceOut = document.createElement('audio');
voiceOut.autoplay = true;
document.body.appendChild(voiceOut);
// voiceOn: from Start until the camera stops. Nothing below connects, retries or switches while it is off, so a phone
// that was put aside never competes with the live one for the worker (it takes one bodycam at a time).
let voiceOn = false, voicePc = null, voiceBusy = false, voiceAgain = false, voiceTimer = null, voiceUpTimer = null;
let voiceBackoff = 2000;
const VOICE_HINT = 'Voice agent reconnecting…';
if (voiceUrl) $('dVoice').hidden = false;

function setVoiceUrl(url) {
  if (voiceFixed || typeof url !== 'string' || !/^https?:\/\//.test(url) || url === voiceUrl) return;
  voiceUrl = url;
  $('dVoice').hidden = false;
  if (voiceOn) { voiceBackoff = 2000; connectVoice().catch(voiceRetry); }   // a new worker link: switch now
}

// The voice hint never hides a camera or mic message: it is shown only over nothing (or itself), and cleared only
// while it is still the one showing.
function voiceHint(show) {
  const h = $('hint');
  if (show && (h.hidden || h.textContent === VOICE_HINT)) hint(VOICE_HINT, true);
  if (!show && !h.hidden && h.textContent === VOICE_HINT) hint('');
}

// Try again later. One retry is pending at a time; the timer re-checks first, so a link that recovered stays.
function voiceRetry() {
  if (!voiceOn || !voiceUrl || voiceTimer) return;
  dot('dVoice', 'off');
  voiceHint(true);
  voiceTimer = setTimeout(() => {
    voiceTimer = null;
    if (!voiceOn || (voicePc && voicePc.connectionState === 'connected')) return;
    connectVoice().catch(voiceRetry);
  }, voiceBackoff);
  voiceBackoff = Math.min(voiceBackoff * 2, 15000);
}

function closeVoice() {
  clearTimeout(voiceTimer); voiceTimer = null;
  clearTimeout(voiceUpTimer);
  if (voicePc) { const old = voicePc; voicePc = null; old.close(); }
}

async function connectVoice() {
  if (!voiceOn || !voiceUrl || !stream) return;
  if (voiceBusy) { voiceAgain = true; return; }   // a Flip or a new link mid-handshake: redo it once this one ends
  voiceBusy = true;
  try {
    closeVoice();
    dot('dVoice', '');
    const base = voiceUrl.replace(/\/$/, '');
    const iceServers = await (await fetch(base + '/api/ice', { signal: AbortSignal.timeout(5000) })).json();
    if (!voiceOn) return;
    const pc = voicePc = new RTCPeerConnection({ iceServers });
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));                   // mic for the ears, camera for the eyes
    pc.ontrack = (e) => { if (e.track.kind === 'audio') voiceOut.srcObject = new MediaStream([e.track]); };
    pc.onconnectionstatechange = () => {
      if (pc !== voicePc) return;
      const st = pc.connectionState;
      dot('dVoice', st === 'connected' ? 'on' : st === 'connecting' || st === 'new' ? '' : 'off');
      if (st === 'connected') {
        voiceHint(false);
        // The backoff resets only after the link has held for 20 s, so a worker that keeps ending the session
        // (brain down, another phone) is retried more and more slowly, not every 2 s.
        clearTimeout(voiceUpTimer);
        voiceUpTimer = setTimeout(() => { voiceBackoff = 2000; }, 20000);
      } else clearTimeout(voiceUpTimer);
      // A short "disconnected" often recovers by itself (a Wi-Fi blip): give it 6 s. Failed or closed: now.
      if (st === 'disconnected') setTimeout(() => { if (pc === voicePc && pc.connectionState !== 'connected') voiceRetry(); }, 6000);
      if (st === 'failed' || st === 'closed') voiceRetry();
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((done) => {
      if (pc.iceGatheringState === 'complete') return done();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && done();
      setTimeout(done, 2000);
    });
    const r = await fetch(base + '/api/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }), signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('offer ' + r.status);
    const answer = await r.json();
    if (pc !== voicePc || !voiceOn) return;
    await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });
    // Never stuck on "connecting": no link in 15 s counts as a failure.
    setTimeout(() => { if (pc === voicePc && pc.connectionState !== 'connected') voiceRetry(); }, 15000);
  } finally {
    voiceBusy = false;
    if (voiceAgain) { voiceAgain = false; connectVoice().catch(voiceRetry); }
  }
}

function stopped() { running = false; voiceOn = false; closeVoice(); dot('dVoice', 'off'); $('start').disabled = false; $('start').textContent = 'Start'; }

$('start').onclick = async () => {
  speak('Bodycam on');                                        // this tap also unlocks the speaker
  if (!navigator.mediaDevices) return hint('Open this page through the https link to use the camera.', true);
  $('start').textContent = 'Starting…';
  try { await openCamera(); }
  catch (_) { dot('dCam', 'off'); dot('dMic', 'off'); stopped(); return hint('Camera or mic blocked. Allow both for this site, then tap Start.', true); }
  try { await navigator.wakeLock.request('screen'); } catch (_) {}
  running = true;
  $('start').disabled = true;
  $('start').textContent = '● Live';
  send('bodycam', 'on');
};
$('test').onclick = () => speak('Speaker test');
$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (running) { try { await openCamera(); } catch (_) { hint('Could not switch camera.', true); } }
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) navigator.wakeLock.request('screen').catch(() => {});
});
</script>
</body>
</html>
