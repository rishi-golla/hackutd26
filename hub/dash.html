<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23ff4d6d%27 d=%27M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.8-1.3 2.3-2.4 4.4-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z%27/%3E%3C/svg%3E">
<style>
  :root { --bg:#07090d; --panel:#0e1219; --line:#1a212c; --text:#eef2f6; --dim:#7f8c9a; --ok:#3fd68f; --warn:#ffb547; --hr:#ff4d6d; --o2:#4cc2ff; }
  * { box-sizing:border-box; margin:0; }
  html { background:var(--bg); color-scheme:dark; }
  body { color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding:28px; max-width:1480px; margin:0 auto; }
  ::selection { background:#26435f; }

  header { display:flex; align-items:center; gap:22px; margin-bottom:24px; }
  .logo { font-size:22px; font-weight:800; letter-spacing:-.03em; margin-right:auto; }
  .logo i { color:var(--hr); font-style:normal; }
  .dot { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; }
  .dot::before { content:""; width:8px; height:8px; border-radius:50%; background:#2b3542; transition:background .3s; }
  .dot.on::before { background:var(--ok); } .dot.warn::before { background:var(--warn); }

  main { display:grid; grid-template-columns:minmax(0, 1.7fr) minmax(320px, 1fr); gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:22px; }
  .label { color:var(--dim); font-size:13px; font-weight:600; }

  .cam { position:relative; aspect-ratio:16/9; border-radius:22px; overflow:hidden; background:#000 radial-gradient(circle at 50% 45%, #121a24, #000 70%); display:grid; place-items:center; color:var(--dim); }
  .cam img { width:100%; height:100%; object-fit:cover; }
  .chip { position:absolute; top:16px; left:16px; padding:6px 12px; border-radius:99px; font-size:12px; font-weight:700; letter-spacing:.08em; background:rgba(7,9,13,.7); backdrop-filter:blur(8px); }
  .chip.live { color:var(--ok); } .chip.stale { color:var(--warn); }
  form { display:flex; gap:10px; margin-top:14px; }
  input { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:99px; padding:14px 20px; font:inherit; caret-color:var(--ok); }
  input:focus { outline:none; border-color:#2f6f9b; }
  button { border:0; border-radius:99px; padding:0 24px; background:var(--text); color:var(--bg); font:700 14px system-ui, sans-serif; cursor:pointer; transition:transform .15s; }
  button:active { transform:scale(.96); }

  aside { display:grid; gap:20px; align-content:start; }
  .vital { display:flex; align-items:center; justify-content:space-between; transition:opacity .4s; }
  .vital.off { opacity:.35; }
  .big { display:flex; align-items:baseline; gap:8px; margin-top:4px; }
  .big b { font-size:96px; font-weight:800; line-height:.9; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
  .big span { color:var(--dim); font-size:16px; }
  .hr b { color:var(--hr); } .o2 b { color:var(--o2); }
  .hr { background:radial-gradient(circle at 85% 50%, rgba(255,77,109,.12), transparent 55%), var(--panel); }
  .heart { width:64px; height:64px; color:var(--hr); }
  .vital:not(.off) .heart { animation:beat var(--beat, 1s) infinite; }
  @keyframes beat { 0%, 100% { transform:scale(1); } 12% { transform:scale(1.18); } 24% { transform:scale(1); } 34% { transform:scale(1.08); } }

  #feed { list-style:none; padding:0; margin-top:12px; max-height:260px; overflow:auto; scrollbar-width:none; }
  #feed li { display:flex; gap:14px; padding:9px 0; border-top:1px solid var(--line); animation:in .5s cubic-bezier(.16,1,.3,1); }
  #feed time { color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; padding-top:1px; white-space:nowrap; }
  #feed span { overflow-wrap:anywhere; }
  @keyframes in { from { opacity:0; transform:translateY(-6px); } }
  .foot { color:var(--dim); font-size:12px; margin-top:18px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } body { padding:18px; } }
</style>
</head>
<body>
<header>
  <div class="logo">Hand<i>off</i></div>
  <span id="dHub" class="dot">Hub</span><span id="dCam" class="dot">Camera</span><span id="dFinger" class="dot">Sensor</span>
</header>

<main>
  <section>
    <div class="cam" id="cam">Waiting for the bodycam</div>
    <form id="say"><input id="text" placeholder="Say something through the bodycam…" autocomplete="off" aria-label="Line for the phone to say"><button>Speak</button></form>
  </section>
  <aside>
    <div class="card vital hr off" id="vHr">
      <div><div class="label">Heart rate</div><div class="big"><b id="hr">—</b><span>bpm</span></div></div>
      <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.8-1.3 2.3-2.4 4.4-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="card vital o2" id="vO2">
      <div><div class="label">Sensor</div><div class="big"><b id="o2" style="font-size:40px;letter-spacing:-.02em">—</b></div></div>
    </div>
    <div class="card"><div class="label">Activity</div><ul id="feed"></ul></div>
  </aside>
</main>
<p class="foot">Prototype · not a medical device<span id="link"></span></p>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const seen = {};
let frameAt = 0, lastMsg = 0, hrAt = 0, stAt = 0;

// What the sensor's state means for the person holding it.
const status = {
  live: 'Reading', no_finger: 'Place finger', settling: 'Hold still…', moving: 'Hold still', weak: 'Press firmer',
  noisy: 'Hold still, press firmly', measuring: 'Measuring…', saturated: 'Press lighter', sensor_error: 'Check sensor',
};

// One readable line per message. Repeated values are skipped.
const words = {
  finger: (v) => ({ on: 'Finger on the sensor', off: 'Finger off the sensor', error: 'Sensor not responding' })[v],
  state: (v) => `Sensor: ${status[v] || v}`,
  say: (v) => `Sent to bodycam: “${v}”`,
  said: (v) => `Bodycam said “${v}”`,
  bodycam: () => 'Bodycam started',
  hub: () => 'Hub started',
  mark: () => 'MARK pressed',
  link: (v) => `Phone link: ${v}`,
};
const quiet = new Set(['hr', 'camera', 'spo2']);
function feed(m) {
  const key = JSON.stringify(m.value);
  if (quiet.has(m.what) || (seen[m.what] === key && m.what !== 'say' && m.what !== 'said')) return;
  seen[m.what] = key;
  const text = (Object.hasOwn(words, m.what) ? words[m.what] : (v) => `${m.from}: ${m.what} ${v}`)(m.value);
  if (!text) return;
  const li = document.createElement('li');
  li.innerHTML = '<time></time><span></span>';
  li.firstChild.textContent = new Date(m.replay ? m.t * 1000 : Date.now()).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  li.lastChild.textContent = text;
  $('feed').prepend(li);
  if ($('feed').children.length > 60) $('feed').lastChild.remove();
}

function handle(m, now) {
  feed(m);
  if (m.what === 'link') $('link').textContent = ` · phone: ${m.value}`;
  if (m.replay || now - m.t > 4) return;                        // history or backlog, never a live value
  if (m.what === 'hr') { $('hr').textContent = m.value || '—'; hrAt = Date.now(); if (m.value) $('vHr').style.setProperty('--beat', 60 / m.value + 's'); }
  if (m.what === 'state') { $('o2').textContent = status[m.value] || m.value; stAt = Date.now(); }
  if (m.what === 'finger') $('dFinger').className = 'dot ' + (m.value === 'on' ? 'on' : 'warn');
  if (m.what === 'camera') frameAt = Date.now();
}

// Live messages: long-poll, so each answer is a normal response that any https tunnel passes straight through.
// e = the hub's start id, so a restarted hub sends a fresh catch-up instead of half a history.
(async () => {
  let after = 0, e = '';
  for (;;) {
    try {
      const r = await fetch(`/poll?after=${after}&e=${e}`, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      after = d.seq; e = d.e; lastMsg = Date.now();
      for (const m of d.msgs) {
        try { handle(m, d.now); } catch (err) { console.error(err); }   // one bad message must not stall the rest
      }
    } catch (_) { await sleep(1000); }
  }
})();

// Camera: ask for the next frame as soon as the last one arrives.
(async () => {
  const img = new Image();
  img.alt = 'Bodycam';
  let shown = 0, url = null;
  for (;;) {
    try {
      const r = await fetch('/frame.jpg?after=' + shown, { cache: 'no-store', signal: AbortSignal.timeout(9000) });
      if (r.status !== 200) { if (r.status !== 204) await sleep(1000); continue; }   // 204 = no new frame in 5 s
      shown = +r.headers.get('X-Seq');
      if (url) URL.revokeObjectURL(url);
      img.src = url = URL.createObjectURL(await r.blob());
      if (!img.isConnected) $('cam').replaceChildren(img, Object.assign(document.createElement('span'), { className:'chip live', textContent:'● LIVE' }));
      frameAt = Date.now();
    } catch (_) { await sleep(1000); }
  }
})();

setInterval(() => {
  $('dHub').className = 'dot ' + (Date.now() - lastMsg < 12000 ? 'on' : '');   // a poll answers at least every 10 s
  if (Date.now() - hrAt > 5000) $('hr').textContent = '—';     // never an old number
  if (Date.now() - stAt > 5000) $('o2').textContent = '—';     // the sensor program stopped reporting
  $('vHr').classList.toggle('off', $('hr').textContent === '—');
  const live = Date.now() - frameAt < 3000;
  $('dCam').className = 'dot ' + (live ? 'on' : '');
  const chip = $('cam').querySelector('.chip');
  if (chip) { chip.className = 'chip ' + (live ? 'live' : 'stale'); chip.textContent = live ? '● LIVE' : 'PAUSED'; }
}, 1000);

$('say').onsubmit = async (e) => {
  e.preventDefault();
  const v = $('text').value.trim();
  if (!v) return;
  const r = await fetch('/send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from:'dash', what:'say', value:v }) }).catch(() => null);
  if (r && r.ok) $('text').value = '';
  else $('text').placeholder = 'Not sent. The hub is unreachable.';
};
</script>
</body>
</html>
