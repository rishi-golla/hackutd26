<meta charset="utf-8">
<title>Handoff Assembly Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one step at a time, like a printed assembly manual page. Picture first, then the parts tray, then one action. Book menu and progress bar on top. */
:root {
  --bg: #eef1f4;
  --card: #ffffff;
  --sunk: #f4f6f8;
  --ink: #12171c;
  --muted: #5a6570;
  --line: #d6dde4;
  --accent: #e2482a;
  --accent-soft: #fde8e2;
  --ok: #18784f;
  --ok-soft: #dcf1e7;
  --no: #b3261e;
  --no-soft: #fbe3e1;
  --warn-soft: #fbf0d9;
  --warn: #8a5300;
  --term: #15191d;
  --term-ink: #dfe6ec;
  --term-dim: #8b98a5;
  --term-green: #7ee2a8;
  --phone: #1a1d21;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1215; --card: #161c21; --sunk: #12171b; --ink: #e8edf1; --muted: #9ca8b3; --line: #2a333b;
    --accent: #ff6a4d; --accent-soft: #3a1d17; --ok: #46c48c; --ok-soft: #12301f; --no: #ff7a70; --no-soft: #3a1a18;
    --warn-soft: #33270f; --warn: #f0b45a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1215; --card: #161c21; --sunk: #12171b; --ink: #e8edf1; --muted: #9ca8b3; --line: #2a333b;
  --accent: #ff6a4d; --accent-soft: #3a1d17; --ok: #46c48c; --ok-soft: #12301f; --no: #ff7a70; --no-soft: #3a1a18;
  --warn-soft: #33270f; --warn: #f0b45a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.brand { font: 800 1.25rem var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin-right: auto; }
.brand span { color: var(--accent); }
.tbtn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: .92rem; }
.tbtn:hover { border-color: var(--ink); }
.prog { height: 4px; background: var(--line); }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; }

/* book menu */
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.bk { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; display: grid; gap: 4px; }
.bk:hover { border-color: var(--ink); }
.bk .n { font: 800 2.2rem/1 var(--font-display); color: var(--accent); }
.bk .t { font: 700 1.3rem var(--font-display); letter-spacing: .02em; }
.bk .s { color: var(--muted); font-size: .9rem; }
.bk .bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bk .bar i { display: block; height: 100%; background: var(--ok); }
.menu-head { display: grid; gap: 6px; margin-bottom: 16px; max-width: 70ch; }
.menu-head h1 { font: 800 clamp(2.2rem, 6vw, 3.4rem)/1 var(--font-display); margin: 0; letter-spacing: .01em; }
.menu-head p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: .9rem; }
.legend span { display: inline-flex; gap: 6px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.legend b { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* step card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
@media (max-width: 860px) { .card { grid-template-columns: minmax(0, 1fr); } }
.pic { background: #f4f6f8; position: relative; display: grid; align-content: center; gap: 0; min-height: 260px; border-right: 1px solid var(--line); }
@media (max-width: 860px) { .pic { border-right: 0; border-bottom: 1px solid var(--line); } }
.pic img.main { width: 100%; height: auto; display: block; }
.pic > .mainwrap, .pic > .pair, .pic > .screens, .pic > .missing { min-width: 0; }
.mainwrap { position: relative; }
.zoom { position: absolute; z-index: 2; right: 12px; bottom: 12px; width: 34%; max-width: 260px; aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--accent); overflow: hidden; background: #fff; box-shadow: 0 4px 18px #0003; }
.zoom img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.pair figure { margin: 0; position: relative; border-top: 1px solid var(--line); }
.pair figure:first-child { border-right: 1px solid var(--line); }
.pair img { width: 100%; height: auto; display: block; }
.mark { position: absolute; top: 8px; left: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 1.5rem var(--font-display); color: #fff; }
.mark.ok { background: var(--ok); } .mark.no { background: var(--no); }
.pair figcaption { position: absolute; left: 56px; top: 14px; font-weight: 600; font-size: .85rem; background: #ffffffe6; color: #12171c; border-radius: 6px; padding: 2px 8px; }
.missing { aspect-ratio: 4/3; display: grid; place-items: center; color: #8a96a2; font: 600 .95rem var(--font-body); background: repeating-linear-gradient(45deg, #f4f6f8, #f4f6f8 12px, #eceff2 12px, #eceff2 24px); text-align: center; padding: 20px; }
.pic .screens { padding: 18px; display: grid; gap: 14px; justify-items: center; }

.side { padding: 18px 20px 22px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.stepno { display: flex; align-items: baseline; gap: 10px; }
.stepno .big { font: 800 3.4rem/0.9 var(--font-display); color: var(--accent); }
.stepno .of { color: var(--muted); font-size: .9rem; }
.action { font: 600 1.35rem/1.3 var(--font-body); margin: 0; text-wrap: balance; }
.sub { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; counter-reset: s; }
.sub li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; counter-increment: s; }
.sub li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--card); display: grid; place-items: center; font: 700 .85rem var(--font-display); }
.tip { margin: 0; color: var(--muted); font-size: .95rem; }
.tray { display: flex; flex-wrap: wrap; gap: 8px; }
.pp { display: grid; grid-template-columns: 54px auto; gap: 8px; align-items: center; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px 4px 4px; }
.pp img, .pp .ph { width: 54px; height: 54px; object-fit: contain; background: #fff; border-radius: 8px; }
.pp .ph { display: grid; place-items: center; font: 800 1.1rem var(--font-display); color: var(--muted); }
.pp .q { font: 800 1.35rem var(--font-display); }
.pp .l { font-size: .78rem; color: var(--muted); line-height: 1.2; }
.trayhead { font: 700 .8rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.okbox, .warnbox, .probbox { border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; font-size: .95rem; }
.okbox { background: var(--ok-soft); border: 1px solid var(--ok); }
.okbox b:first-child { color: var(--ok); }
.warnbox { background: var(--no-soft); border: 1px solid var(--no); }
.warnbox b:first-child { color: var(--no); }
details.probbox { background: var(--sunk); border: 1px solid var(--line); }
details.probbox summary { cursor: pointer; font-weight: 600; }
details.probbox table { width: 100%; border-collapse: collapse; font-size: .9rem; }
details.probbox td { border-top: 1px solid var(--line); padding: 6px 4px; vertical-align: top; }
details.probbox td:first-child { width: 42%; color: var(--muted); }
code { font: .9em var(--font-mono); background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
.choice { display: flex; gap: 10px; flex-wrap: wrap; }
.choice button { flex: 1 1 160px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; }
.choice button b { display: block; font: 700 1.2rem var(--font-display); }
.choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .85rem; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 3px 10px; }
.chip.file { font-family: var(--font-mono); font-size: .8rem; }
table.fill { width: 100%; border-collapse: collapse; font-size: .95rem; }
table.fill td { padding: 6px 4px; border-top: 1px solid var(--line); }
table.fill td:last-child { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.holes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.holes div { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .9rem; }
.holes b { font-family: var(--font-mono); }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
.nav .where { flex: 1; min-width: 0; color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
.nbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding-inline: 22px; }
.nbtn:disabled { opacity: .4; cursor: default; }

/* screen mock-ups */
.term { width: 100%; max-width: 640px; background: var(--term); color: var(--term-ink); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px #0002; text-align: left; }
.term .bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: #23292f; font: 500 .78rem var(--font-body); color: var(--term-dim); }
.term .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; display: inline-block; }
.term .bar i:nth-child(2) { background: #febc2e; } .term .bar i:nth-child(3) { background: #28c840; }
.term .bar span { margin-left: 8px; }
.term pre { margin: 0; padding: 12px 14px; font: .86rem/1.55 var(--font-mono); overflow-x: auto; white-space: pre; }
.term .c { color: var(--term-green); }
.term .c::before { content: "$ "; color: var(--term-dim); }
.term .o { color: var(--term-ink); }
.term .d { color: var(--term-dim); }
.term .h { background: #e2482a33; outline: 2px solid #ff6a4d; border-radius: 3px; }
.term .copy { margin: 0 10px 10px; float: right; font: 600 .78rem var(--font-body); background: #2d353d; color: var(--term-ink); border: 1px solid #44505b; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.phone { width: 270px; max-width: 100%; background: var(--phone); border-radius: 30px; padding: 10px; box-shadow: 0 8px 28px #0003; }
.phone .scr { background: #fff; color: #1f2328; border-radius: 22px; overflow: hidden; font: 13px/1.35 var(--font-body); min-height: 420px; display: flex; flex-direction: column; }
.phone .status { display: flex; justify-content: space-between; padding: 6px 14px 2px; font-size: 11px; color: #555; }
.phone .url { margin: 4px 10px 6px; background: #eef1f4; border-radius: 16px; padding: 6px 12px; font: 11px var(--font-mono); color: #333; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.phone .body { padding: 8px 12px 14px; display: grid; gap: 8px; align-content: start; flex: 1; }
.phone .tabs { display: flex; gap: 4px; }
.phone .tab { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; background: #eef1f4; font-weight: 600; font-size: 12px; }
.phone .tab.on { background: #1f2328; color: #fff; }
.phone .chips2 { display: flex; flex-wrap: wrap; gap: 4px; }
.phone .chips2 span { font-size: 10.5px; border-radius: 10px; padding: 2px 7px; background: #dcf1e7; color: #146240; font-weight: 600; }
.phone .chips2 span.bad { background: #fbe3e1; color: #a1221b; }
.phone .pb { border-radius: 10px; padding: 9px 10px; text-align: center; font-weight: 600; background: #eef1f4; border: 2px solid transparent; }
.phone .pb.pri { background: #1f6feb; color: #fff; }
.phone .tap { border-color: #ff6a4d; box-shadow: 0 0 0 4px #ff6a4d55; position: relative; }
.phone .tap::after { content: attr(data-n); position: absolute; right: -8px; top: -10px; width: 22px; height: 22px; border-radius: 50%; background: #e2482a; color: #fff; font: 700 12px/22px var(--font-body); text-align: center; }
.phone h4 { margin: 2px 0 0; font-size: 14px; }
.phone .field { border: 1px solid #c9d1d9; border-radius: 8px; padding: 7px 9px; font: 12px var(--font-mono); background: #fff; }
.phone .verdict { border-radius: 10px; padding: 10px; font-weight: 700; }
.phone .muted { color: #6a737d; font-size: 11.5px; }
.phone .camui { background: #111; color: #fff; flex: 1; display: grid; grid-template-rows: 1fr auto; border-radius: 0; }
.phone .vf { background: linear-gradient(160deg, #3a4752, #1e252b); display: grid; place-items: center; color: #9fb0bf; font-size: 12px; }
.phone .zooms { display: flex; justify-content: center; gap: 8px; padding: 8px; }
.phone .zooms span { width: 34px; height: 34px; border-radius: 50%; background: #333; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.phone .zooms span.on { background: #fff; color: #111; }
.phone .rec { display: flex; justify-content: center; gap: 22px; align-items: center; padding: 6px 0 14px; font-size: 11px; }
.phone .rec b { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #fff; background: #e53935; display: block; }
.win { width: 100%; max-width: 560px; background: #fff; color: #1f2328; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px #0002; border: 1px solid #d0d7de; text-align: left; }
.win .bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: #eef1f4; font: 500 .78rem var(--font-body); color: #57606a; }
.win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; display: inline-block; }
.win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
.win .bar span { margin-left: 8px; }
.win .wb { padding: 14px; display: grid; gap: 10px; font-size: .9rem; }
.win .row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; }
.win .row label { color: #57606a; font-size: .82rem; }
.win .val { border: 1px solid #c9d1d9; border-radius: 6px; padding: 6px 9px; font: .85rem var(--font-mono); background: #f6f8fa; }
.win .val.hl { border-color: #e2482a; box-shadow: 0 0 0 3px #e2482a33; background: #fff; }
.win .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.win .big3 div { border: 2px solid #c9d1d9; border-radius: 8px; padding: 10px 8px; text-align: center; font-size: .82rem; }
.win .big3 div b { display: block; font-size: .72rem; color: #57606a; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.win .big3 div.hl { border-color: #e2482a; box-shadow: 0 0 0 3px #e2482a33; }
.win .chk { display: flex; gap: 8px; align-items: center; }
.win .chk i { width: 16px; height: 16px; border-radius: 4px; background: #1f6feb; display: inline-block; position: relative; }
.win .chk i::after { content: "✓"; color: #fff; position: absolute; inset: 0; font: 700 12px/16px var(--font-body); text-align: center; }
.win .progress { height: 10px; background: #eef1f4; border-radius: 5px; overflow: hidden; }
.win .progress i { display: block; height: 100%; width: 62%; background: #1f6feb; }
.mac-note { font-size: .8rem; color: var(--muted); text-align: center; }

/* all-steps list */
.list { display: grid; gap: 18px; }
.list .card { scroll-margin-top: 80px; }
.bookhead { margin: 26px 0 4px; font: 800 2rem var(--font-display); }
.bookhead span { color: var(--accent); margin-right: 8px; }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>

<header class="top">
  <div class="in">
    <div class="brand">Handoff <span>assembly</span></div>
    <button class="tbtn" id="btnBooks" type="button">Books</button>
    <button class="tbtn" id="btnView" type="button">Show all steps</button>
  </div>
  <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
</header>

<main class="wrap" id="app"></main>

<nav class="nav" aria-label="Step navigation">
  <div class="in">
    <button class="nbtn" id="btnPrev" type="button">← Back</button>
    <div class="where" id="where"></div>
    <button class="nbtn primary" id="btnNext" type="button">Done, next →</button>
  </div>
</nav>

<script>
/* ------------------------------------------------------------------ */
/* Parts and hardware                                                  */
/* ------------------------------------------------------------------ */
const PARTS = {
  A: "Bodycam outer shell", B: "Bodycam chest plate", C: "Relay base", D: "Relay lid",
  F: "Finger tray", G: "Finger cradle", T1: "Mount test", T2: "Fit ring", RT: "Rail test (optional)", UP: "Universal phone plate (optional)", LP: "LCD pod (optional)", LC: "LCD1602 screen (kit, 4-pin)",
  P: "Raspberry Pi 4", S: "Qwiic SHIM", M: "Finger sensor", K: "MARK button",
  BB: "Mini breadboard", HS: "Heatsink", Q2: "Long Qwiic cable (500 mm)",
  PB: "Your power bank", UC: "Your USB-C cable", HR: "Chest harness", PH: "Pixel 9 Pro",
  h4: "220 Ω resistor", h5: "Jumper, female–male", h6: "Hook-and-loop strap, ≤13 mm wide, ≤1.2 mm thick", h7: "Zip tie", h8: "Black tape", h9: "Jumper, male–male", RB: "Rubber band, about 2 mm wide", glue: "Hot glue"
};
const icon = k => `img/icon_${k}.jpg`;

/* screen mock-up helpers */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function term(title, lines, copy) {
  const body = lines.map(l => {
    const t = l.slice(2), k = l[0];
    if (k === "$") return `<span class="c">${esc(t)}</span>`;
    if (k === "!") return `<span class="o h">${esc(t)}</span>`;
    if (k === "~") return `<span class="d">${esc(t)}</span>`;
    return `<span class="o">${esc(t)}</span>`;
  }).join("\n");
  const cmds = lines.filter(l => l[0] === "$").map(l => l.slice(2)).join("\n");
  return `<div class="term"><div class="bar"><i></i><i></i><i></i><span>${esc(title)}</span></div><pre>${body}</pre>${copy !== false && cmds ? `<button class="copy" type="button" data-copy="${esc(cmds)}">Copy commands</button>` : ""}</div>`;
}
function phone(url, body) {
  return `<div class="phone"><div class="scr"><div class="status"><span>9:41</span><span>▲ ▮▮▮</span></div>${url ? `<div class="url">${esc(url)}</div>` : ""}<div class="body">${body}</div></div></div>`;
}
const CHIPS = `<div class="chips2"><span>✓ Secure context</span><span>✓ Camera API</span><span>✓ Motion sensor API</span><span>✓ Wake lock API</span><span>✓ Speech</span><span>✓ Web Audio</span></div>`;
const TABS = on => `<div class="tabs">${["Camera","Motion","Speaker","Screen"].map(t => `<span class="tab${t===on?" on":""}">${t}</span>`).join("")}</div>`;
const PAGEURL = "http://172.20.10.4:8000/";
function win(title, body) { return `<div class="win"><div class="bar"><i></i><i></i><i></i><span>${esc(title)}</span></div><div class="wb">${body}</div></div>`; }

/* ------------------------------------------------------------------ */
/* Books and steps                                                     */
/* ------------------------------------------------------------------ */
const BOOKS = [
  { id: "b0", n: "0", title: "Parts and tools", sub: "Check you have everything" },
  { id: "b1", n: "1", title: "Choose your case", sub: "A 10-minute phone test decides which bodycam case to print" },
  { id: "b2", n: "2", title: "Print", sub: "Two fit tests, an optional rail test, then 6 parts" },
  { id: "b3", n: "3", title: "Set up the Pi", sub: "Flash the card and install the software" },
  { id: "b4", n: "4", title: "Finger clip", sub: "Built first: its cable goes into the relay box" },
  { id: "b5", n: "5", title: "Relay box", sub: "Pi, finger cable, button and wiring" },
  { id: "b6", n: "6", title: "Bodycam", sub: "Phone in the case, case on the harness. No screws." },

const KEY = "handoff-manual-v1";
let st = { i: -1, done: {}, mode: "rear", inv: {}, all: false, rev: 6 };
let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) st = Object.assign(st, saved); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
/* rev 3 (Nov 1): the OLED was dropped, the base's USB-C opening grew, and Book 5 was renumbered.
   Old Book 5 ticks no longer match, and base C and lid D must be reprinted. */
/* rev 5 (Nov 3): no snaps. Books 2 and 4-6 renumbered and every printed part remade, so old print,
   assembly and printed-part ticks no longer match. */
if (saved && saved.rev !== 5 && saved.rev !== 6) {
  Object.keys(st.done).filter(k => /^[2456]\./.test(k) && k !== "2.1").forEach(k => delete st.done[k]);
  ["O", "Q1", "A", "B", "C", "D", "F", "G", "J", "T3", "RT"].forEach(k => delete st.inv[k]);
  if (st.i >= 0 && (!S[st.i] || S[st.i].book >= "b2")) st.i = -1;
  st.rev = 5;
  save();
}
/* rev 6 (Nov 3): lid posts replace the Pi glue. Book 5 renumbered and lid D remade. */
if (st.rev !== 6) {
  Object.keys(st.done).filter(k => /^5\./.test(k) || k === "2.10").forEach(k => delete st.done[k]);
  delete st.inv.D;
  if (st.i >= 0 && S[st.i] && S[st.i].book === "b5") st.i = -1;
  st.rev = 6;
  save();
}
const app = document.getElementById("app");

function imgTag(id, cls) {
  return `<img class="${cls || "main"}" src="img/${id}.jpg" alt="" loading="lazy" onerror="this.outerHTML='<div class=missing>Picture for this step is being drawn</div>'">`;
}
function tray(parts) {
  if (!parts || !parts.length) return "";
  return `<div><div class="trayhead">You need</div><div class="tray">${parts.map(([k, n]) =>
    `<div class="pp"><img src="${icon(k)}" alt="" onerror="this.outerHTML='<span class=ph>${k}</span>'"><div><div class="q">${n}× <span style="font-size:.85rem;color:var(--muted)">${k}</span></div><div class="l">${PARTS[k] || k}</div></div></div>`).join("")}</div></div>`;
}
function modeName() { return st.mode === "front" ? "front" : "rear"; }

function specialHTML(s) {
  const m = modeName();
  switch (s.special) {
    case "inventory": {
      const groups = [
        ["Printed parts", ["A","B","C","D","F","G","T1","T2","RT"]],
        ["Electronics", ["P","S","M","K","BB","HS","Q2"]],
        ["Other", ["PB","UC","HR","PH"]],
        ["Small bits", ["h4","h5","h6","h7","h8","h9","RB","glue"]]
      ];
      const counts = { h4: "5", h5: "6", h6: "3", h7: "2", h8: "1 roll", h9: "2", HS: "1", RB: "2", glue: "4 dots" };
      return groups.map(([g, ks]) => `<div><div class="trayhead">${g}</div><div class="tray">${ks.map(k =>
        `<label class="pp" style="cursor:pointer"><input type="checkbox" id="inv-${k}" data-inv="${k}" ${st.inv[k] ? "checked" : ""} style="position:absolute;opacity:0">
          <img src="${icon(k)}" alt="" onerror="this.outerHTML='<span class=ph>${k}</span>'"><div><div class="q">${st.inv[k] ? "✓ " : ""}${counts[k] ? counts[k] + "× " : ""}<span style="font-size:.85rem;color:var(--muted)">${k}</span></div><div class="l">${PARTS[k]}</div></div></label>`).join("")}</div></div>`).join("") +
        `<p class="tip">Tap a part to tick it. Printed parts come from Book 2; tick them after printing. Straps: two that wrap the closed relay box and your power bank with 5 cm of overlap, about 32–35 cm each (10–12 mm wide fits best), and one about 20 cm, black, for the finger. Rubber bands: two soft ones about 2 mm wide, each about 14–15 cm long laid flat.</p>`;
    }
    case "tools":
      return `<div class="tray">${[
        ["🔥", "Hot glue gun"], ["✂️", "Scissors"], ["🔪", "Hobby knife or flush cutters"],
        ["📏", "Ruler or calipers"], ["💾", "microSD card 16 GB+ and a card reader"], ["🖊️", "Masking tape and a marker"], ["🖍️", "Red paint pen (optional)"]
      ].map(([e, t]) => `<div class="pp"><span class="ph" style="font-size:1.6rem">${e}</span><div class="l" style="font-size:.9rem;color:var(--ink)">${t}</div></div>`).join("")}</div>`;
    case "verdict":
      return `<div class="choice" role="group" aria-label="Case version">
        <button type="button" data-mode="rear" aria-pressed="${m === "rear"}"><b>Rear version</b>Verdict says REAR MODE, or MAYBE REAR and one camera is clearly wider.</button>
        <button type="button" data-mode="front" aria-pressed="${m === "front"}"><b>Front version</b>Verdict says FRONT MODE.</button></div>
        <p class="tip">MAYBE REAR: open each rear camera; if one is clearly wider, tap <b>This is the ultra-wide</b> and choose Rear.</p>`;
    case "measure":
      return `<table class="fill"><tbody>
        <tr><td><b>a</b> Bar width, side to side</td><td>61 mm</td></tr>
        <tr><td><b>b</b> Bar height, top to bottom</td><td>19 mm</td></tr>
        <tr><td><b>c</b> Phone's top edge to the bar</td><td>9.5 mm</td></tr>
        <tr><td><b>d</b> How far the bar sticks out</td><td>3.6 mm</td></tr></tbody></table>
        <div class="okbox"><b>All within 0.5 mm?</b>Go on to step 2.2.</div>
        <details class="probbox"><summary>One is more than 0.5 mm off</summary>
          <p style="margin:6px 0">Open <code>hardware/cad/common.scad</code> in a text editor and change <code>camera_bar_w</code> (a), <code>camera_bar_h</code> (b), <code>camera_bar_top</code> (c) or <code>camera_bar_protrusion</code> (d). Save, then run:</p>
          ${term("Terminal — Mac", ["$ cd ~/Documents/Hackathons/HackUTD-2026/hardware", "$ cad/.venv/bin/python cad/verify.py", "~ PASS ...", "! ALL CHECKS PASSED"])}
        </details>`;
    case "printtests":
      return `<div class="chips"><span class="chip file">cad/stl/p1_mount_test.stl</span><span class="chip">T1 · about 25 min</span></div>
        <div class="chips"><span class="chip file">cad/stl/p1_${m}_fit_ring.stl</span><span class="chip">T2 · about 12 min</span></div>
        <div class="chips"><span class="chip">PLA or PETG</span><span class="chip">0.2 mm layers</span><span class="chip">No supports</span><span class="chip">Don't rotate or scale</span></div>
        <p class="tip">The file names follow your Book 1 choice: <b>${m}</b>.</p>`;
    case "print": {
      const p = s.print;
      const file = p.file.endsWith(".stl") ? p.file : `p1_${m}_${p.file}.stl`;
      return `<div class="chips"><span class="chip file">cad/stl/${file}</span></div>
        <div class="chips"><span class="chip">${p.black ? "Black PLA or PETG" : "PLA or PETG"}</span><span class="chip">0.2 mm layers</span><span class="chip">${p.walls} walls</span><span class="chip">${p.infill} ${p.infill === "100%" ? "rectilinear" : "gyroid"}</span><span class="chip">Brim ${p.brim}</span><span class="chip">No supports</span><span class="chip">${p.time}</span></div>
        <p class="tip">Leave it exactly as it loads: the file is already the right way up.</p>`;
    }
    case "identify":
      return `<div class="choice" style="flex-direction:column">
          <div class="okbox"><b>Yes, labelled</b>Mark each wire with tape: SW, SW, +, R, G, B. Then go to step 5.25.</div>
          <div class="probbox" style="display:grid;gap:6px"><b>No labels: use the helper</b>
            <ol class="sub"><li>Pi unplugged. Add the spare resistor from d7 to d15.</li><li>Plug a male–male jumper into a15: its loose end is the <b>+ probe</b>.</li><li>Plug a male–male jumper into b5: its loose end is the <b>− probe</b>.</li><li>Plug the Pi in, log in, and run the helper. Touch the wires it names; type what lights.</li></ol>
            ${term("SSH — handoff-relay", ["$ python3 identify_wires.py", "~ ...", "  RESULT (common anode, found in 11 steps)", "    switch      : wires 1 and 2", "    ring common : wire 3", "!   red : wire 4   green : wire 5   blue : wire 6"])}
            <p class="tip" style="margin:0">When it asks for the switch wires on pins 11 and 9, push them into a3 and a5 instead. Tape-label every wire. Then shut the Pi down with <code>sudo poweroff</code>, wait 10 seconds, unplug it, and remove the probes and the spare resistor.</p>
          </div></div>`;
    case "camapp":
      return phone(null, `<div class="camui"><div class="vf">viewfinder</div><div><div class="zooms"><span class="${m === "rear" ? "on" : ""}">.5</span><span class="${m === "rear" ? "" : "on"}">1×</span><span>2×</span><span>5×</span></div><div class="rec"><span>Photo</span><b></b><span style="font-weight:700">Video</span></div></div></div>`) +
        `<p class="tip">${m === "rear" ? "Rear version: tap <b>.5</b> for the ultra-wide." : "Front version: switch to the front camera."} Then tap the red button.</p>`;
    case "phonein":
      return `<p class="tip">${m === "rear" ? "Rear version: <b>screen up</b>, back down, so the camera bar drops into its window." : "Front version: <b>screen down</b>, facing out through the window."} No side button should be pressed.</p>`;
  }
  return "";
}

function holesHTML(h) {
  if (!h) return "";
  return `<div class="holes">${h.map(([a, b]) => `<div><b>${a}</b>${b ? `<br><span class="tip" style="font-size:.82rem">${b}</span>` : ""}</div>`).join("")}</div>`;
}
function cardHTML(s, idx) {
  const book = BOOKS.find(b => b.id === s.book);
  const inBook = S.filter(x => x.book === s.book);
  const pos = inBook.indexOf(s) + 1;
  let pic = "";
  if (s.img) pic += `<div class="mainwrap">${imgTag(s.img)}${s.zoom ? `<div class="zoom">${imgTag(s.zoom, "z")}</div>` : ""}</div>`;
  if (s.img2) pic += imgTag(s.img2 === "b2_bed_T2" ? `b2_bed_T2${modeName() === "front" ? "f" : "r"}` : s.img2);
  if (s.ok_img) pic += `<div class="pair"><figure><span class="mark ok">✓</span><figcaption>${s.okcap || ""}</figcaption>${imgTag(s.ok_img, "x")}</figure><figure><span class="mark no">✗</span><figcaption>${s.nocap || ""}</figcaption>${imgTag(s.no_img, "x")}</figure></div>`;
  if (s.screens) pic += `<div class="screens">${s.screens.join("")}</div>`;
  if (s.special === "camapp") pic += `<div class="screens">${specialHTML(s).split('<p class="tip">')[0]}</div>`;
  if (!pic) pic = `<div class="screens" style="align-content:center;min-height:200px"><div style="font:800 5rem var(--font-display);color:var(--accent)">${book.n}</div></div>`;
  let sp = s.special && s.special !== "camapp" ? specialHTML(s) : (s.special === "camapp" ? `<p class="tip">${specialHTML(s).split('<p class="tip">')[1] || ""}` : "");
  if (s.special === "print" || s.special === "printtests") {
    // swap the A/B bed image to the chosen mode
  }
  return `<article class="card" id="step-${s.id}">
    <div class="pic">${pic}</div>
    <div class="side">
      <div class="stepno"><span class="big">${s.id}</span><span class="of">Book ${book.n} · ${book.title} · step ${pos} of ${inBook.length}</span></div>
      <h2 class="action">${s.action}</h2>
      ${tray(s.parts)}
      ${s.sub ? `<ol class="sub">${s.sub.map(x => `<li><span>${x}</span></li>`).join("")}</ol>` : ""}
      ${holesHTML(s.holes)}
      ${sp}
      ${s.tip ? `<p class="tip">${s.tip}</p>` : ""}
      ${s.warn ? `<div class="warnbox"><b>Careful</b>${s.warn}</div>` : ""}
      ${s.ok ? `<div class="okbox"><b>Check</b>${s.ok}</div>` : ""}
      ${s.prob ? `<details class="probbox"><summary>Not what you see?</summary><table><tbody>${s.prob.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</tbody></table></details>` : ""}
    </div>
  </article>`;
}

const FRONT_BASES = ["b2_t2_test", "b6_01_shell", "b6_04_phone", "b6_05_align", "b6_05_plate", "b6_05_strap", "b6_05_strap_second", "b6_06_buckle"];
function frontName(id) {
  if (!id) return id;
  for (const b of FRONT_BASES) {
    if (id === b) return b + "_front";
    if (id.startsWith(b + "_") && /_(zoom|ok|no)$/.test(id) && id.slice(b.length).match(/^_(zoom|ok|no)$/)) return b + "_front" + id.slice(b.length);
  }
  return id;
}
function fixBedImage(s) {
  let o = s;
  if (s.special === "print" && s.print.k === "A") o = Object.assign({}, o, { img: `b2_bed_A_${modeName()}` });
  if (modeName() === "front") {
    o = Object.assign({}, o, { img: frontName(o.img), zoom: frontName(o.zoom), ok_img: frontName(o.ok_img), no_img: frontName(o.no_img) });
  }
  return o;
}

function renderMenu() {
  st.i = -1; save();
  const total = S.length, done = S.filter(s => st.done[s.id]).length;
  app.innerHTML = `<div class="menu-head"><h1>Handoff assembly manual</h1>
    <p>One step at a time. The picture shows what to do; the new part is the bright one. Tap <b>Done, next</b> after each step. Your place is saved on this device.</p>
    <div class="legend"><span><b style="background:var(--accent)"></b>New part in this step</span><span><b style="background:var(--ok)"></b>Check</span><span><b style="background:var(--no)"></b>Careful</span></div>
    <p style="margin-top:6px">${done} of ${total} steps done. Your bodycam case: <b>${modeName()}</b> version.</p></div>
    <div class="menu">${BOOKS.map(b => {
      const steps = S.filter(s => s.book === b.id), d = steps.filter(s => st.done[s.id]).length;
      return `<button class="bk" type="button" data-book="${b.id}"><span class="n">${b.n}</span><span class="t">${b.title}</span><span class="s">${b.sub} · ${steps.length} steps</span><span class="bar"><i style="width:${Math.round(100 * d / steps.length)}%"></i></span></button>`;
    }).join("")}</div>`;
  updateChrome();
}
function renderStep() {
  const s = fixBedImage(S[st.i]);
  app.innerHTML = cardHTML(s, st.i);
  window.scrollTo({ top: 0 });
  updateChrome();
}
function renderAll() {
  let html = "";
  BOOKS.forEach(b => {
    html += `<h2 class="bookhead"><span>${b.n}</span>${b.title}</h2><div class="list">`;
    S.filter(s => s.book === b.id).forEach(s => { html += cardHTML(fixBedImage(s), S.indexOf(s)); });
    html += `</div>`;
  });
  app.innerHTML = html;
  updateChrome();
}
function render() { if (st.all) renderAll(); else if (st.i < 0) renderMenu(); else renderStep(); }

function updateChrome() {
  const done = S.filter(s => st.done[s.id]).length;
  document.getElementById("progBar").style.width = (100 * done / S.length) + "%";
  document.getElementById("btnView").textContent = st.all ? "One step at a time" : "Show all steps";
  const nav = document.querySelector(".nav");
  nav.classList.toggle("hidden", st.all || st.i < 0);
  if (st.i >= 0 && !st.all) {
    const s = S[st.i], b = BOOKS.find(x => x.id === s.book);
    document.getElementById("where").textContent = `Step ${s.id} · ${b.title}`;
    document.getElementById("btnPrev").disabled = st.i === 0;
    document.getElementById("btnNext").textContent = st.i === S.length - 1 ? "Done ✓" : (st.done[s.id] ? "Next →" : "Done, next →");
  }
}

/* ------------------------------------------------------------------ */
/* Events                                                              */
/* ------------------------------------------------------------------ */
document.getElementById("btnBooks").addEventListener("click", () => { st.all = false; renderMenu(); });
document.getElementById("btnView").addEventListener("click", () => { st.all = !st.all; save(); if (!st.all && st.i < 0) renderMenu(); else render(); });
document.getElementById("btnPrev").addEventListener("click", () => { if (st.i > 0) { st.i--; save(); renderStep(); } });
document.getElementById("btnNext").addEventListener("click", () => {
  const s = S[st.i]; st.done[s.id] = true;
  if (st.i < S.length - 1) { st.i++; save(); renderStep(); } else { save(); renderMenu(); }
});
document.addEventListener("keydown", e => {
  if (st.all || st.i < 0 || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") document.getElementById("btnNext").click();
  if (e.key === "ArrowLeft") document.getElementById("btnPrev").click();
});
app.addEventListener("click", e => {
  const bk = e.target.closest("[data-book]");
  if (bk) { const first = S.findIndex(s => s.book === bk.dataset.book && !st.done[s.id]); st.i = first >= 0 ? first : S.findIndex(s => s.book === bk.dataset.book); st.all = false; save(); renderStep(); return; }
  const md = e.target.closest("[data-mode]");
  if (md) { st.mode = md.dataset.mode; save(); render(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const txt = cp.getAttribute("data-copy").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
    const ok = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy commands", 1500); };
    try { navigator.clipboard.writeText(txt).then(ok, () => { cp.textContent = "Select and copy"; }); } catch (err) { cp.textContent = "Select and copy"; }
  }
});
app.addEventListener("change", e => {
  const inv = e.target.closest("[data-inv]");
  if (inv) { st.inv[inv.dataset.inv] = inv.checked; save(); render(); }
});
render();
</script>
