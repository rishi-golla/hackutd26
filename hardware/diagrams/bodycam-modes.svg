<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="930" viewBox="0 0 1450 930">
<rect width="100%" height="100%" fill="#f8faf9"/>
<text x="40" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#142b3a" text-anchor="start">Bodycam camera modes</text>
<text x="40" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526675" text-anchor="start">Both modes wear the phone landscape; mount and GoPro buckle remain on the chest-facing side</text>
