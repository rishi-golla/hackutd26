<text x="725" y="873" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526675" text-anchor="middle">The harness buckle has 3 prongs; the case has the mating 2-prong mount. Tilt axis is parallel to the long edge.</text>
