<text x="929" y="710" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#142b3a" text-anchor="middle">2-prong mount</text>
<text x="1151" y="630" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#142b3a" text-anchor="start">OUTWARD →</text>
<text x="1151" y="660" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142b3a" text-anchor="start">Screen → outward</text>
