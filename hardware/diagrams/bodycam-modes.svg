<text x="375" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#526675" text-anchor="middle">Screen faces chest; rear camera bar faces outward.</text>
<text x="375" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#526675" text-anchor="middle">OUTWARD VIEW</text>
